<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #263b70, #101522 55%, #080b12);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .home {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Game Logo */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            background: linear-gradient(145deg, #586cff, #2736a8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            letter-spacing: 3px;
            text-shadow: 0 5px 15px black;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aeb8d0;
            margin-bottom: 40px;
            font-size: 15px;
        }

        /* Buttons */
        .menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 7px 15px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .start {
            background: linear-gradient(135deg, #00c853, #00a844);
            font-size: 22px;
        }

        .continue {
            background: linear-gradient(135deg, #536dfe, #304ffe);
        }

        .settings {
            background: #252d3d;
        }

        .about {
            background: #252d3d;
        }

        .footer {
            margin-top: 35px;
            color: #68738b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="home">

        <!-- Logo -->
        <div class="logo">
            🎮
        </div>

        <h1>MY GAME</h1>

        <p class="subtitle">Ready for the challenge?</p>

        <div class="menu">

            <!-- Start Game -->
            <button class="btn start"
                onclick="location.href='1-25lvl.html'">
                ▶ START GAME
            </button>

            <!-- Future Feature -->
            <button class="btn continue"
                onclick="alert('Continue feature coming soon!')">
                ↪ CONTINUE
            </button>

            <!-- Future Feature -->
            <button class="btn settings"
                onclick="alert('Settings coming soon!')">
                ⚙ SETTINGS
            </button>

            <!-- Future Feature -->
            <button class="btn about"
                onclick="alert('About section coming soon!')">
                ℹ ABOUT
            </button>

        </div>

        <div class="footer">
            © 2026 My Game
        </div>

    </div>

</body>
</html>

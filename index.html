<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Chess - Supabase Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 20px 0;
      padding: 15px;
      background: #1f2937;
      border-radius: 10px;
    }

    #games {
      margin-top: 20px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .game {
      background: #1f2937;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>♟️ Online Chess</h1>

  <div id="status">Connecting to Supabase...</div>

  <button onclick="createGame()">Create Test Game</button>
  <button onclick="loadGames()">Refresh Games</button>

  <div id="games"></div>

<script>

  // =========================
  // SUPABASE CONFIG
  // =========================

  const SUPABASE_URL =
    "https://mobjgpztclgjlsnraiwx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_0Be8a82wzeNZqGq1_6aS-Q_sNWHrYoK";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // =========================
  // CONNECTION TEST
  // =========================

  async function testConnection() {

    const { data, error } = await client
      .from("games")
      .select("*")
      .limit(5);

    if (error) {
      document.getElementById("status").innerText =
        "❌ Connection/Error: " + error.message;

      console.error(error);
      return;
    }

    document.getElementById("status").innerText =
      "✅ Supabase Connected!";

    showGames(data);
  }


  // =========================
  // CREATE GAME
  // =========================

  async function createGame() {

    const { data, error } = await client
      .from("games")
      .insert({
        player1: "Player 1",
        status: "waiting",
        turn: "white",
        board: {}
      })
      .select()
      .single();

    if (error) {

      alert("❌ Game create error:\n" + error.message);

      console.error(error);
      return;
    }

    alert("✅ Game Created!\nGame ID:\n" + data.id);

    loadGames();
  }


  // =========================
  // LOAD GAMES
  // =========================

  async function loadGames() {

    const { data, error } = await client
      .from("games")
      .select("*")
      .order("created_at", {
        ascending: false
      });

    if (error) {

      document.getElementById("status").innerText =
        "❌ Error: " + error.message;

      console.error(error);
      return;
    }

    showGames(data);
  }


  // =========================
  // SHOW GAMES
  // =========================

  function showGames(games) {

    const container =
      document.getElementById("games");

    if (!games || games.length === 0) {

      container.innerHTML =
        "<p>No games yet.</p>";

      return;
    }

    container.innerHTML = "";

    games.forEach(game => {

      const div =
        document.createElement("div");

      div.className = "game";

      div.innerHTML = `
        <b>Game ID:</b> ${game.id}<br>
        <b>Player 1:</b> ${game.player1 || "-"}<br>
        <b>Player 2:</b> ${game.player2 || "-"}<br>
        <b>Turn:</b> ${game.turn}<br>
        <b>Status:</b> ${game.status}
      `;

      container.appendChild(div);

    });
  }


  // =========================
  // REALTIME
  // =========================

  client
    .channel("games-realtime")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "games"
      },
      payload => {

        console.log("Realtime update:", payload);

        loadGames();

      }
    )
    .subscribe((status) => {

      console.log("Realtime:", status);

    });


  // START

  testConnection();

</script>

</body>
</html>

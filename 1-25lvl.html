<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
            min-height: 100vh;
            padding: 25px 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .levels {
            max-width: 600px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .level-btn {
            height: 80px;
            border: none;
            border-radius: 15px;
            background: #252b38;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .level-btn:hover {
            transform: translateY(-3px);
            background: #343c4d;
        }

        .level-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 450px) {
            .levels {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>🎮 LEVELS</h1>

    <div class="levels">

        <button class="level-btn" onclick="location.href='1lvl.html'">Level 1</button>
        <button class="level-btn" onclick="location.href='2lvl.html'">Level 2</button>
